name: Web UI tests

on:
  push:
    branches: [dev]
    paths:
      - "web-ui/**"
      - "run-web-ui.bat"
      - ".github/workflows/web-ui-tests.yml"
  pull_request:
    branches: [dev]
    paths:
      - "web-ui/**"
      - "run-web-ui.bat"
      - ".github/workflows/web-ui-tests.yml"

jobs:
  web-ui-unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Web UI dependencies
        run: python -m pip install -r web-ui/requirements.txt
      - name: Run Cốc Cốc snapshot tests
        run: python -m unittest discover -s web-ui/tests -v
